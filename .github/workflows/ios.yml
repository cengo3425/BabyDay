name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build BabyDay
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode Project
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          find . -maxdepth 5 -type f | sort | head -300

          echo ""
          echo "Searching for Xcode project..."

          PROJECT=$(find . -name "BabyDay.xcodeproj" -type d -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: BabyDay.xcodeproj could not be found."
            echo ""
            echo "Available Xcode projects:"
            find . -name "*.xcodeproj" -type d
            exit 1
          fi

          echo "FOUND PROJECT: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Show Project Structure
        shell: bash
        run: |
          echo "Using project:"
          echo "$PROJECT"

          echo ""
          echo "Project directory:"
          dirname "$PROJECT"

          echo ""
          echo "Project contents:"
          find "$PROJECT" -maxdepth 2 -type f | sort | head -100

      - name: Build BabyDay
        shell: bash
        run: |
          echo "Building:"
          echo "$PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -scheme BabyDay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Check Build Result
        if: always()
        shell: bash
        run: |
          echo "Build finished."

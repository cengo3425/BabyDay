name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build BabyDay
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
  run: |
    xcodebuild \
      -project BabyDay.xcodeproj \
      -scheme BabyDay \
      -sdk iphonesimulator \
      -destination 'generic/platform=iOS Simulator' \
      build

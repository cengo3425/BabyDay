name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build BabyDay
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Xcode project
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 5 -type f \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

          PROJECT=$(find . -type d -name "BabyDay.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: BabyDay.xcodeproj bulunamadı!"
            echo "Bulunan Xcode dosyaları:"
            find . -type f \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print
            exit 1
          fi

          echo "FOUND PROJECT: $PROJECT"
          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: Build BabyDay
        shell: bash
        run: |
          echo "Building: $PROJECT_PATH"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "BabyDay" \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Check Build Result
        if: always()
        run: |
          echo "Build step finished."

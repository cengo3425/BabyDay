name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build BabyDay
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          find . -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - name: Clean Build Folder
        run: |
          rm -rf "$RUNNER_TEMP/BabyDayBuild"

      - name: Build BabyDay
        run: |
          set -o pipefail

          xcodebuild \
            -project "BabyDay.xcodeproj" \
            -scheme "BabyDay" \
            -configuration "Release" \
            -sdk "iphoneos" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/BabyDayBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Check Build Result
        if: always()
        run: |
          echo "Build directory:"
          find "$RUNNER_TEMP/BabyDayBuild" -maxdepth 5 -type d 2>/dev/null | head -100

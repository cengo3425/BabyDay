name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build BabyDay
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          find . -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build BabyDay
        run: |
          set -o pipefail

          PROJECT=$(find . -maxdepth 3 -name "BabyDay.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: BabyDay.xcodeproj bulunamadı."
            exit 1
          fi

          echo "Project: $PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "BabyDay" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Check Build Result
        if: always()
        run: |
          echo "Build workflow finished."

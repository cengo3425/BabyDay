name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build BabyDay
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          pwd
          echo "Xcode projects:"
          find . -name "*.xcodeproj" -print
          echo "Xcode workspaces:"
          find . -name "*.xcworkspace" -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Clean Build Folder
        run: |
          xcodebuild \
            -project BabyDay.xcodeproj \
            -scheme BabyDay \
            -configuration Debug \
            -sdk iphonesimulator \
            clean \
            CODE_SIGNING_ALLOWED=NO

      - name: Build BabyDay
        run: |
          xcodebuild \
            -project BabyDay.xcodeproj \
            -scheme BabyDay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            VALID_ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64

      - name: Check Build Result
        run: |
          echo "Build completed."
          find "$RUNNER_TEMP/DerivedData" -name "*.app" -print

name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build BabyDay
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "All Xcode projects:"
          find . -name "*.xcodeproj" -print

          echo ""
          echo "All Xcode workspaces:"
          find . -name "*.xcworkspace" -print

      - name: Find Xcode project
        id: find_project
        shell: bash
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE" -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj found!"
            exit 1
          fi

          echo "Found project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Check Xcode project
        run: |
          PROJECT="${{ steps.find_project.outputs.project }}"

          echo "Using project:"
          echo "$PROJECT"

          ls -la "$PROJECT"

      - name: Clean Build
        run: |
          PROJECT="${{ steps.find_project.outputs.project }}"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "BabyDay" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/_temp/BabyDayBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Check Build Result
        if: always()
        run: |
          echo "Build finished."

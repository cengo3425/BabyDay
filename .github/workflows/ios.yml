name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build BabyDay
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          pwd
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"

      - name: Clean Build
        run: |
          xcodebuild \
            -project BabyDay.xcodeproj \
            -scheme BabyDay \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/BabyDayBuild" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Check Build Result
        run: |
          if [ -d "$RUNNER_TEMP/BabyDayBuild/Build/Products/Debug-iphonesimulator/BabyDay.app" ]; then
            echo "✅ BabyDay build başarılı."
          else
            echo "❌ BabyDay.app bulunamadı."
            exit 1
          fi
